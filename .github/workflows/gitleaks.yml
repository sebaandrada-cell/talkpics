name: gitleaks

# Secret scanning on every push (any branch) and every pull request.
# GitHub's own secret scanning is not enough on its own; this blocks a leaked key before it is merged.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
